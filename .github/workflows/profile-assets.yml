name: Generate profile assets (pacman + snake)

# 2026-09-10 修复: 原 pacman.yml / snake.yml 两个 workflow 都往 output 分支推自己的 dist/,
#   crazy-max/ghaction-github-pages 是"用 dist 整体替换分支", 于是谁后跑谁把对方的 SVG 删掉,
#   导致 README 里的 pacman-contribution-graph.svg 长期 404。
#   现在合并成一个 workflow: 先生成两份产物, 再从 output 分支补回历史产物, 最后一次性推送。

on:
  schedule:
    # 每 12 小时 (UTC 00:00 / 12:00 = 北京 08:00 / 20:00)
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout output branch (existing assets)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: output
          path: existing

      - name: Generate pacman contribution graph (light + dark)
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
          hide_month_labels: "false"

      - name: Generate snake contribution graph (dark + light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark
            dist/snake-light.svg?palette=github

      - name: Keep previously generated assets (avoid clobbering)
        run: |
          mkdir -p dist
          if [ -d existing ]; then
            find existing -maxdepth 1 -name '*.svg' | while read -r f; do
              b="$(basename "$f")"
              if [ ! -e "dist/$b" ]; then cp -v "$f" "dist/$b"; fi
            done
          fi
          echo "--- dist ---"
          ls -la dist

      - name: Push assets to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
